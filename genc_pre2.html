<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Community Event Gallery</title>

    <style>

        .eventImage {
            border: 3px solid black;
            width: 150px;
            height: 100px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            padding: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

    <table border="1">

        <caption>
            Community Events Gallery
        </caption>

        <tr>
            <td>
                <img
                    src="tree.jpg"
                    alt="Tree Plantation Event"
                    title="Tree Plantation Drive"
                    class="eventImage">

                <br>
                Tree Plantation Drive
            </td>

            <td>
                <img
                    src="blood.jpg"
                    alt="Blood Donation Camp"
                    title="Blood Donation Camp"
                    class="eventImage">

                <br>
                Blood Donation Camp
            </td>

            <td>
                <img
                    src="cleanup.jpg"
                    alt="Clean Up Program"
                    title="Community Clean Up"
                    class="eventImage">

                <br>
                Clean Up Drive
            </td>
        </tr>

        <tr>
            <td>
                <img
                    src="sports.jpg"
                    alt="Sports Event"
                    title="Sports Meet"
                    class="eventImage">

                <br>
                Sports Meet
            </td>

            <td>
                <img
                    src="health.jpg"
                    alt="Health Camp"
                    title="Health Awareness Program"
                    class="eventImage">

                <br>
                Health Camp
            </td>

            <td>
                <img
                    src="education.jpg"
                    alt="Education Workshop"
                    title="Education Workshop"
                    class="eventImage">

                <br>
                Education Workshop
            </td>
        </tr>

    </table>

</body>
</html>
